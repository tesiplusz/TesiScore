<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TesiScore</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/scoreboard.css">
    <link rel="stylesheet" href="css/panel.css">
        <link rel="stylesheet" href="css/molkky.css">
</head>

<body>

    <!-- Beállítások -->
    <button id="settingsButton" title="Beállítások">⚙</button>


    <!-- Eredményjelző -->

    <main id="scoreboard">

        <section class="team">
            <div id="leftSets" class="sets">0</div>

            <div id="teamLeftName" class="teamName">
                A csapat
            </div>

           <div id="leftScore" class="score"></div>
           
        </section>

        <section id="middle">

            <div id="scoreSeparator">
                :
            </div>

        </section>

        <section class="team">
            <div id="rightSets" class="sets">0</div>

            <div id="teamRightName" class="teamName">
                B csapat
            </div>

            <div id="rightScore" class="score"></div>

        </section>

    </main>
    <div id="matchMessage" class="matchMessage">

    ÜZENET

</div>
    <div id="timerArea">

    <div id="timerDisplay">
        10:00
    </div>

</div>

    <!-- Alsó vezérlés -->

    <footer id="controls">

        <div class="scoreButtons">

            <button id="leftPlus">+</button>
            <button id="leftMinus">−</button>

        </div>

        <div class="timeButtons">

            <button id="startStop">▶</button>
            <button id="reset">⟳</button>
            <button id="fullscreen">⛶</button>

        </div>

        <div class="scoreButtons">

            <button id="rightPlus">+</button>
            <button id="rightMinus">−</button>

        </div>

    </footer>
    
    <div id="molkkyView" hidden>

    <main id="molkkyBoard">

        <div class="molkkyHeader">

            <div>Játékos</div>
            <div>Dobások</div>
            <div>Pont</div>

        </div>

        <div id="molkkyPlayers">

            <!-- Ide kerülnek majd a játékosok -->

        </div>

        <div id="molkkyButtons">

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>10</button>
            <button>11</button>
            <button>12</button>

            <button class="missButton">X</button>

            <button id="molkkyUndo">↶ Undo</button>

        </div>

    </main>

</div>
    <aside id="settingsPanel">

    <h2>Beállítások</h2>

    <label for="ln">Bal csapat</label>
    <input
        id="ln"
        type="text"
        value="KÉKEK">
<label for="leftColor">
    Bal pontszín
</label>

<select id="leftColor">

    <option value="#2F80FF" selected>Kék</option>
    <option value="#FF4040">Piros</option>
    <option value="#00C853">Zöld</option>
    <option value="#FFD400">Sárga</option>
    <option value="#FFFFFF">Fehér</option>

</select>
    <label for="rn">Jobb csapat</label>
    <input
        id="rn"
        type="text"
        value="PIROSAK">
        <label for="rightColor">
    Jobb pontszín
</label>

<select id="rightColor">

    <option value="#FF4040" selected>Piros</option>
    <option value="#2F80FF">Kék</option>
    <option value="#00C853">Zöld</option>
    <option value="#FFD400">Sárga</option>
    <option value="#FFFFFF">Fehér</option>

</select>

    <hr>

    <label for="matchTime">
        Játékidő (perc)
    </label>

    <input
        id="matchTime"
        type="number"
        min="1"
        max="999"
        value="10">

    <label class="checkboxRow">

        <input
            id="showTimer"
            type="checkbox"
            checked>

        <span>Idő kijelzése</span>

    </label>

    <hr>

    <label for="sportSelect">
        Sport
    </label>

   <select id="sportSelect">

   <option value="simple" selected>
    🏅 Egyszerű pontszámláló
</option>

<option value="volleyball">
    🏐 Röplabda
</option>
<option value="molkky">Mölkky</option>

</select>
<hr>

<h3>Megjelenés</h3>

<label for="themeSelect">
    Téma
</label>

<select id="themeSelect">

    <option value="dark">
        🌙 Sötét
    </option>

    <option value="light">
        ☀️ Világos
    </option>

</select>
    <div id="volleyballSettings">

        <hr>

        <h3>Röplabda</h3>

        <label for="setsToWin">
            Győztes szettek
        </label>

        <input
            id="setsToWin"
            type="number"
            min="1"
            value="3">

        <label for="pointsToWin">
            Szett pontszám
        </label>

        <input
            id="pointsToWin"
            type="number"
            min="1"
            value="25">

        <label for="lastSetPoints">
            Döntő szett pontszáma
        </label>

        <input
            id="lastSetPoints"
            type="number"
            min="1"
            value="15">

    </div>

    <div class="panelButtons">

        <button id="cancel">
            Mégse
        </button>

        <button id="save">
            Mentés
        </button>

    </div>

</aside>
    <script type="module" src="js/app.js"></script>

</body>
</html>
