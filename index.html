<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TesiScore</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/scoreboard.css">
    <link rel="stylesheet" href="css/panel.css">
</head>

<body>

    <!-- Beállítások -->
    <button id="settingsButton" title="Beállítások">⚙</button>

   
    <div id="matchMessage"></div>

    <!-- Eredményjelző -->

    <main id="scoreboard">

        <section class="team">
            <div id="leftSets" class="sets">0</div>

            <div id="teamLeftName" class="teamName">
                KÉKEK
            </div>

           <div id="leftScore" class="score">
                18
            </div>
            <div id="sevenSegmentTest"></div>

        </section>

        <section id="middle">

            <div id="scoreSeparator">
                :
            </div>

        </section>

        <section class="team">
            <div id="rightSets" class="sets">0</div>

            <div id="teamRightName" class="teamName">
                PIROSAK
            </div>

            <div id="rightScore" class="score">
                16
            </div>

        </section>

    </main>
    <div id="timerArea">

    <div id="timerDisplay">
        10:00
    </div>

</div>

    <!-- Alsó vezérlés -->

    <footer id="controls">

        <div class="scoreButtons">

            <button id="leftPlus">+</button>
            <button id="leftMinus">−</button>

        </div>

        <div class="timeButtons">

            <button id="startStop">▶</button>
            <button id="reset">⟳</button>
            <button id="fullscreen">⛶</button>

        </div>

        <div class="scoreButtons">

            <button id="rightPlus">+</button>
            <button id="rightMinus">−</button>

        </div>

    </footer>
    <aside id="settingsPanel">

    <h2>Beállítások</h2>

    <label for="ln">Bal csapat</label>
    <input
        id="ln"
        type="text"
        value="KÉKEK">

    <label for="rn">Jobb csapat</label>
    <input
        id="rn"
        type="text"
        value="PIROSAK">

    <hr>

    <label for="matchTime">
        Játékidő (perc)
    </label>

    <input
        id="matchTime"
        type="number"
        min="1"
        max="999"
        value="10">

    <label class="checkboxRow">

        <input
            id="showTimer"
            type="checkbox"
            checked>

        <span>Idő kijelzése</span>

    </label>

    <hr>

    <label for="sportSelect">
        Sport
    </label>

    <select id="sportSelect">

        <option value="football">
            ⚽ Foci
        </option>

        <option value="volleyball" selected>
            🏐 Röplabda
        </option>

        <option value="basketball">
            🏀 Kosárlabda
        </option>

        <option value="handball">
            🤾 Kézilabda
        </option>

        <option value="floorball">
            🏑 Floorball
        </option>

    </select>

    <div id="volleyballSettings">

        <hr>

        <h3>Röplabda</h3>

        <label for="setsToWin">
            Győztes szettek
        </label>

        <input
            id="setsToWin"
            type="number"
            min="1"
            value="3">

        <label for="pointsToWin">
            Szett pontszám
        </label>

        <input
            id="pointsToWin"
            type="number"
            min="1"
            value="25">

        <label for="lastSetPoints">
            Döntő szett pontszáma
        </label>

        <input
            id="lastSetPoints"
            type="number"
            min="1"
            value="15">

    </div>

    <div class="panelButtons">

        <button id="cancel">
            Mégse
        </button>

        <button id="save">
            Mentés
        </button>

    </div>

</aside>
    <script type="module" src="js/app.js"></script>
<script type="module">

import {
    SevenSegmentDisplay
}
from "./js/sevensegment.js";

const left =
document.getElementById("leftScore");

new SevenSegmentDisplay(left,18);

</script>
</body>
</html>
