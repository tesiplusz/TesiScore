<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TesiScore</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/scoreboard.css">
    <link rel="stylesheet" href="css/panel.css">
    <link rel="stylesheet" href="css/sevensegment.css">
</head>

<body>

    <!-- Beállítások -->
    <button id="settingsButton" title="Beállítások">⚙</button>

    <!-- Felső óra -->
    <header id="timerArea">

        <div id="timerDisplay">
            10:00
        </div>

    </header>

    <!-- Eredményjelző -->

    <main id="scoreboard">

        <section class="team">

            <div id="teamLeftName" class="teamName">
                KÉKEK
            </div>

           <div id="leftScore" class="score">
                18
            </div>

        </section>

        <section id="middle">

            <div id="scoreSeparator">
                :
            </div>

        </section>

        <section class="team">

            <div id="teamRightName" class="teamName">
                PIROSAK
            </div>

            <div id="rightScore" class="score">
                16
            </div>

        </section>

    </main>

    <!-- Alsó vezérlés -->

    <footer id="controls">

        <div class="scoreButtons">

            <button id="leftPlus">+</button>
            <button id="leftMinus">−</button>

        </div>

        <div class="timeButtons">

            <button id="startStop">▶</button>
            <button id="reset">⟳</button>

        </div>

        <div class="scoreButtons">

            <button id="rightPlus">+</button>
            <button id="rightMinus">−</button>

        </div>

    </footer>

    <script type="module" src="js/app.js"></script>
<script type="module">

import {
    SevenSegmentDisplay
}
from "./js/sevensegment.js";

const left =
document.getElementById("leftScore");

new SevenSegmentDisplay(left,18);

</script>
</body>
</html>
